name: Validate Customizations

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate plugin manifests, skills, links, and catalog parity
        run: python3 scripts/validate_customizations.py

      - name: Run hook and script unit tests
        run: |
          if [ -d tests ]; then
            python3 -m unittest discover -s tests -v
          fi
